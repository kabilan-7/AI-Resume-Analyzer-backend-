#Groq AI (free)
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=llama-3.3-70b-versatile
spring.ai.openai.chat.options.temperature=0.0

#PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/screenerdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

#JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

#File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#Server
server.port=8080

#CORS
app.cors.allowed-origins=http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500

# JWT config
# IMPORTANT: this secret must be at least 32 characters (256 bits) for HS256
# Generate a random one for production ? never reuse this example value
app.jwt.secret=your-super-secret-key-change-this-in-production-min-32-chars
app.jwt.expiration-ms=86400000
# 86400000 ms = 24 hours
